# Make fprintd expose libfprint's built-in virtual_image device at a known socket.
# The VFS495 bridge delivers real sensor scans into this socket (see packaging/fedora/).
[Service]
Environment=FP_VIRTUAL_IMAGE=/run/fprint/virtimg_sock
# libfprint simulates the virtual device heating up while an auth session waits for a
# finger. Once HOT (>0.731) it rejects every scan with "Device disabled to prevent
# overheating" until it cools below 0.5 (~3 min). That model is meant for the virtual
# debugging device only and causes intermittent fingerprint failures in real PAM use.
# -1 disables the model for this driver (upstream-documented env var).
Environment=FP_VIRTUAL_IMAGE_HOT_SECONDS=-1
Environment=G_MESSAGES_DEBUG=
RuntimeDirectory=fprint
RuntimeDirectoryMode=0700
